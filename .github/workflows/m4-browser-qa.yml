name: M4 actual-game browser QA

on:
  pull_request:
  push:
    branches: [feat/m4-visual-migration]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: M4 static and provenance checks
        run: |
          node --test tests/m4-*.test.mjs tests/m2-s01.test.mjs
          node tools/m4-build-presentation.mjs --check
      - name: Install pinned test-only Chromium driver
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Real game browser QA
        run: npm run qa:m4:browser
      - name: Preserve screenshots even when a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-actual-game-browser-qa
          path: artifacts/m4-browser-qa/
          if-no-files-found: warn
          retention-days: 14
