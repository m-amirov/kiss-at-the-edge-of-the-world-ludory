name: M3 canonical narrative QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: m3-narrative-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  narrative:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check authored story syntax
        run: node --check game/src/story.js
      - name: Full canonical narrative suite
        run: npm test
